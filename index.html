<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastya Photo | Запись на съемку</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px 15px; max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; color: #fff; font-weight: 600; }
        p.subtitle { text-align: center; color: #8e8e93; font-size: 14px; margin-bottom: 25px; }
        
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 25px; }
        .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; }
        
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #e5e5ea; }
        
        .services { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .service-card { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .service-card.active { border-color: #0a84ff; background: #1c2333; }
        .service-card h3 { font-size: 15px; margin-bottom: 6px; }
        .service-card p { font-size: 14px; color: #0a84ff; font-weight: bold; }

        form { background: #1c1c1e; padding: 20px; border-radius: 16px; border: 1px solid #2c2c2e; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #8e8e93; margin-bottom: 6px; }
        input, select { width: 100%; background: #2c2c2e; border: none; padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
        
        button.submit-btn { width: 100%; background: #0a84ff; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button.submit-btn:disabled { background: #3a3a3c; opacity: 0.6; }
        
        .success-msg { display: none; background: #30d158; color: black; padding: 15px; border-radius: 12px; text-align: center; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>nastya.photoartist</h1>
    <p class="subtitle">Запись на фотосессию в Даугавпилсе</p>

    <div class="gallery">
        <img src="https://i.postimg.cc/44y2R34D/1.jpg" alt="Photo 1">
        <img src="https://i.postimg.cc/kG8S4Z9p/2.jpg" alt="Photo 2">
        <img src="https://i.postimg.cc/G3xXQ3M0/3.jpg" alt="Photo 3">
        <img src="https://i.postimg.cc/50S8xM7t/4.jpg" alt="Photo 4">
    </div>

    <div class="section-title">Выберите услугу</div>
    <div class="services">
        <div class="service-card active" onclick="selectService(this, 'Индивидуальная', '15€')">
            <h3>Индивидуальная</h3>
            <p>15 €</p>
        </div>
        <div class="service-card" onclick="selectService(this, 'Love Story', '20€')">
            <h3>Love Story</h3>
            <p>20 €</p>
        </div>
        <div class="service-card" onclick="selectService(this, 'Семейная', '25€')">
            <h3>Семейная</h3>
            <p>25 €</p>
        </div>
        <div class="service-card" onclick="selectService(this, 'Мероприятия', '25€')">
            <h3>Мероприятия</h3>
            <p>25 €</p>
        </div>
    </div>

    <form id="bookingForm">
        <input type="hidden" id="serviceName" value="Индивидуальная (15€)">

        <div class="form-group">
            <label>Ваше имя и фамилия</label>
            <input type="text" id="userName" placeholder="Например: Анна" required>
        </div>

        <div class="form-group">
            <label>Телефон / Instagram / Telegram</label>
            <input type="text" id="userContact" placeholder="@nickname или телефон" required>
        </div>

        <div class="form-group">
            <label>Выберите день (Пн, Вт, Чт — после 16:00)</label>
            <input type="date" id="bookingDate" required>
        </div>

        <div class="form-group">
            <label>Время съемки</label>
            <select id="bookingTime" required>
                <option value="">Выберите время</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
            </select>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Записаться</button>
        <div class="success-msg" id="successMsg">✨ Заявка успешно отправлена! Скоро свяжусь с вами.</div>
    </form>

    <script>
        let selectedService = "Индивидуальная (15€)";

        function selectService(element, name, price) {
            document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            selectedService = name + " (" + price + ")";
            document.getElementById('serviceName').value = selectedService;
        }

        const dateInput = document.getElementById('bookingDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        dateInput.addEventListener('change', function() {
            const day = new Date(this.value).getDay();
            if (day !== 1 && day !== 2 && day !== 4) {
                alert('Доступные дни для записи: Понедельник, Вторник и Четверг.');
                this.value = '';
            }
        });

        const BOT_TOKEN = '8282222657:AAFJ6-YBPSeXNvP8TSYbGh5nh2N9NcnoWxc';
        const CHAT_ID = '7996564405';

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Отправка...';

            const name = document.getElementById('userName').value;
            const contact = document.getElementById('userContact').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            const message = `📸 *Новая заявка на съемку!*\n\n` +
                            `👤 *Имя:* ${name}\n` +
                            `📞 *Контакты:* ${contact}\n` +
                            `💫 *Услуга:* ${selectedService}\n` +
                            `📅 *Дата:* ${date}\n` +
                            `⏰ *Время:* ${time}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('bookingForm').reset();
                    btn.innerText = 'Записаться';
                    btn.disabled = false;
                } else {
                    alert('Ошибка отправки. Попробуйте еще раз.');
                    btn.disabled = false;
                    btn.innerText = 'Записаться';
                }
            } catch (error) {
                alert('Ошибка сети.');
                btn.disabled = false;
                btn.innerText = 'Записаться';
            }
        });
    </script>
</body>
</html>
